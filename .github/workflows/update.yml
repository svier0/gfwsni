name: 定时更新HOSTS

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      # 下载域名列表
      - name: 下载域名列表
        run: |
          wget -q "https://github.com/svier0/gfwsni/releases/download/0/domain.txt" -O domain_list.txt

      # 下载github hosts
      - name: 下载github hosts
        run: |
          wget -q "https://raw.githubusercontent.com/521xueweihan/GitHub520/master/hosts" -O github520_hosts \
            || echo '' > github520_hosts

      # 执行DNS查询 dig 查询每个域名的IP  一行一个 去掉#注释行和空行
      - name: DNS查询
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          {
            echo "# Generated by svier0/gfwsni at $NOW"
            echo ""
            echo "####### ####### ####### ####### ####### ####### #######"
            while IFS= read -r line || [ -n "$line" ]; do
              # 空行和注释行原样保留
              if [ -z "$line" ] || echo "$line" | grep -q '^\s*#'; then
                echo "$line"
              else
                domain=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                ip=$(dig +short "$domain" A +time=3 +tries=1 2>/dev/null | head -n 1)
                [ -n "$ip" ] && echo "$ip $domain" || echo "# $domain # query failed"
              fi
            done < domain_list.txt
            echo ""
            echo "####### ####### ####### ####### ####### ####### #######"
            echo ""
          } > hosts

      # Pixiv处理
      - name: Pixiv处理
        run: |
          # 提取 pixiv.net 根域名的 IP（取第一个非注释的有效行）
          ROOT_IP=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ pixiv\.net$' hosts | head -n 1 | awk '{print $1}')
          if [ -z "$ROOT_IP" ]; then
            echo "未找到 pixiv.net 的 IP 记录，跳过处理"
            exit 0
          fi

          # 提取根域名 IP 前两段作为基准
          ROOT_PREFIX=$(echo "$ROOT_IP" | cut -d. -f1-2)
          echo "pixiv.net 根域名 IP: $ROOT_IP, 基准前缀: $ROOT_PREFIX"

          # 遍历所有 pixiv.net 子域名行，替换不符合基准的 IP
          while IFS= read -r line; do
            # 匹配: IP pixiv.net 的子域名（以数字开头的行，第二列包含 .pixiv.net）
            domain=$(echo "$line" | awk '{print $2}')
            if echo "$domain" | grep -qE '^[a-zA-Z0-9.-]+\.pixiv\.net$'; then
              current_ip=$(echo "$line" | awk '{print $1}')
              current_prefix=$(echo "$current_ip" | cut -d. -f1-2)
              if [ "$current_prefix" != "$ROOT_PREFIX" ]; then
                echo "替换: $current_ip $domain -> $ROOT_IP $domain"
                sed -i "s|^$current_ip $domain|$ROOT_IP $domain|" hosts
              fi
            fi
          done < <(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ .+\.pixiv\.net$' hosts)

      # 合并
      - name: 合并
        run: |
          cat hosts github520_hosts > hosts.tmp
          mv hosts.tmp hosts

      # 上传
      - name: 上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除旧附件（除了当前要上传的）
          gh release view 0 --repo svier0/gfwsni --json assets --jq '.assets[].name' | \
            grep -v '^hosts$' | \
            while read -r name; do
              gh release delete-asset 0 --repo svier0/gfwsni --name "$name" 2>/dev/null || true
            done

          # 上传新的 hosts
          gh release upload 0 --repo svier0/gfwsni hosts --clobber