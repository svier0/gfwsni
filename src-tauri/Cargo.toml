[package]
name = "gfwsni"
version = "1.2.0"
edition = "2021"
description = "gfwsni: 本地 443 代理，绕过 SNI 阻断"

[lib]
name = "gfwsni_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rcgen = { version = "0.13", features = ["x509-parser"] }
publicsuffix = { version = "2", features = ["std"] }
ureq = { version = "2", features = ["gzip"] }
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", features = ["auto-color", "color"] }
rand = "0.8"
humantime = "2"
time = { version = "0.3", features = ["std", "local-offset"] }
der = { version = "0.7", features = ["alloc", "derive", "oid", "std"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
